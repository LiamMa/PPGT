out_dir: results
metric_best: accuracy-SBM
accelerator: "cuda:0"
num_workers: 15
mlflow:
  use: False
  project: CLUSTER
  name: CLUSTER
wandb:
  use: False
  project: CLUSTER
  name: CLUSTER
dataset:
  pe_transform_on_the_fly: True
  format: PyG-GNNBenchmarkDataset
  name: CLUSTER
  task: graph
  task_type: classification
  transductive: False
  split_mode: standard
  node_encoder: True
  node_encoder_name: LinearNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
posenc_RRWP:
  enable: True
  ksteps: 32
  add_identity: True
  add_node_attr: False
  add_uniform: False
  sym_norm: False
  k_hop: -1
train:
  mode: custom
  batch_size: 16
  eval_period: 1
  ckpt_period: 100
model:
  type: BaseGraphNet
  loss_fun: weighted_cross_entropy
  edge_decoding: dot
gt:
  pos_enc:
    enable: True
    node_encoder:
      enable: True
      raw_norm: 'none'
      post_norm: 'none'
      name: 'MLPNodeEncoder+MLPNodeEncoder+MLPNodeEncoder'
      pe_name: 'rrwp+log_deg+log_order'
      in_dim: '33+1+1'
      MLPNodeEncoder:
        post_norm: 'none'
        kaiming_uniform_linear_init: True
    edge_encoder:
      enable: True
      post_norm: 'none'
      raw_norm: 'none'
      name: 'MLPSinEdgeEncoder+EdgeFFN'
      pe_name: 'rrwp+edge'
      in_dim: '33+56'
      MLPSinEdgeEncoder:
        to_complete_graph: True
        sin_L: 3
        hid_dim: '128'
        bias: True
        add_raw_feat: True
        add_invD: True
        add_invN: True
        kaiming_uniform_linear_init: True
      EdgeFFN:
        pre_mlp_norm: 'ada_rms_norm'
        post_mlp_norm: 'none'
        pre_backbone_norm: 'none'
        post_backbone_norm: 'ada_rms_norm'
        num_blocks: 2
        ffn_ratio: 2
        add_weight_norm: False
        add_spectral_norm: False
        dropout: 0.
        proj_drop: 0.
        drop_path: 0.
        drop_path_scale: True
        act: 'gelu'
  layer_type: PPGTLayer
  layers: 16
  n_heads: 7
  dim_hidden: 56          # `gt.dim_hidden` must match `gnn.dim_inner`
  dropout: 0.
  proj_drop: 0.
  drop_path: 0.3
  drop_path_scale: True
  attn_dropout: 0.3
  norm_fn: "ada_rms_norm"
  macro_norm_type: 'pre_norm'
  pre_backbone_norm: 'none'
  post_backbone_norm: 'ada_rms_norm'
  layer_scale: False  # post-norm doesn't need LayerScale
  alpha: 1e-4
  attn:
    qkv_bias: True
    urpe: True
    l2dist: True
    zero_token: False
    learned_scale: False
    gate: False
    deg_scaler: False
    clamp: None
    act: 'gelu'
gnn:
  head: linear_node_nodecay
  trunc_init: True
  post_pooling_norm: 'none'
  layers_pre_mp: 0
  layers_post_mp: 2
  dim_inner: 56             # `gt.dim_hidden` must match `gnn.dim_inner`
  batchnorm: False
  act: 'gelu'
  dropout: 0.0
  agg: mean
  normalize_adj: False
optim:
  clip_grad_norm: True
  optimizer: timm_adamW
  weight_decay: 1e-5
  base_lr: 1e-3
  max_epoch: 150
  num_warmup_epochs: 10
  scheduler: timm_cosine_with_warmup
  min_lr: 1e-4
